name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    defaults:
      run:
        working-directory: clairo-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clairo
          POSTGRES_PASSWORD: clairo
          POSTGRES_DB: clairo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clairo -d clairo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Empty => conftest falls back to a throwaway SQLite file. With Postgres the
      # whole suite (including the Alembic migrations) runs against the real thing.
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://clairo:clairo@localhost:5432/clairo_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clairo-backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clairo-frontend/clairo-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clairo-frontend/clairo-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build API/worker image (includes policy index build)
        run: docker build -t clairo-api ./clairo-backend
      - name: Build frontend image
        run: docker build -t clairo-web ./clairo-frontend/clairo-frontend

  deploy:
    name: Deploy
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://clairo-4bgp.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      # Render only auto-deploys if the service is wired for it; a deploy hook makes
      # "tests passed on main" the single thing that triggers a release.
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for the API to report healthy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          for i in $(seq 1 40); do
            if curl -fsS --max-time 20 "$BACKEND_URL/health" | grep -q '"status":"ok"'; then
              echo "API healthy"; exit 0
            fi
            echo "waiting for deploy ($i/40)..."; sleep 15
          done
          echo "API did not become healthy in time"; exit 1

      - name: Deploy frontend to Vercel
        if: env.VERCEL_TOKEN != '' && env.VERCEL_PROJECT_ID != ''
        working-directory: clairo-frontend/clairo-frontend
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Nothing to deploy
        if: env.RENDER_DEPLOY_HOOK_URL == '' && env.VERCEL_TOKEN == ''
        run: echo "No deploy secrets configured; skipping. See README > CI/CD."
