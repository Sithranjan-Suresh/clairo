services:
  - type: web
    name: clairo-api
    runtime: python
    # run_ingest.py rebuilds the ChromaDB policy index from the PDFs in
    # app/data/policies/ — it's not committed to the repo, so every deploy
    # regenerates it fresh from source.
    buildCommand: pip install -r requirements.txt && python run_ingest.py
    # Render assigns the actual listening port via $PORT at runtime — a
    # hardcoded port here can silently fail Render's health check and leave
    # the deploy stuck "in progress" even after a successful build.
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false